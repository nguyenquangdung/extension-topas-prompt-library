<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topas Prompt Library</title>
  <link rel="stylesheet" href="index.css">
  <script src="lib/supabase-lib.js"></script>
  <script src="lib/lucide.min.js"></script>
</head>

<body>
  <!-- Login Screen -->
  <div id="login-screen">
    <div style="margin-bottom: 32px;">
      <div class="logo-icon" style="width: 64px; height: 64px; margin: 0 auto 16px auto; border-radius: 16px;">
        <i data-lucide="zap" width="32" height="32"></i>
      </div>
      <h1 class="logo-name" style="font-size: 32px;">Topas</h1>
      <p class="logo-tagline" style="font-size: 14px;">Prompt Library</p>
    </div>
    <button id="btn-login-google" class="btn-google">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" height="20" alt="G">
      Login with Google
    </button>
  </div>

  <!-- App Screen -->
  <div id="app-screen" class="hidden">
    <header>
      <div class="header-brand">
        <img src="logo.png" alt="Topas Logo" class="header-logo">
        <div class="logo-text-wrapper">
          <span class="logo-name">Topas</span>
          <span class="logo-tagline">Prompt Library</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="btn-logout" class="btn-icon" title="Logout">
          <i data-lucide="log-out" width="18"></i>
        </button>
      </div>
    </header>

    <div class="filters-container">
      <div class="select-wrapper">
        <select id="select-market" class="custom-select"></select>
        <div class="select-icon"><i data-lucide="chevron-down" width="16"></i></div>
      </div>
      <div class="select-wrapper">
        <select id="select-topic" class="custom-select"></select>
        <div class="select-icon"><i data-lucide="chevron-down" width="16"></i></div>
      </div>
      <button id="btn-add-topic" class="btn-add-topic-inline">
        <i data-lucide="plus" width="14"></i> Thêm chủ đề
      </button>
    </div>

    <div class="search-container">
      <div class="search-input-wrapper">
        <i data-lucide="search" class="search-icon" width="16"></i>
        <input type="text" id="input-search" class="search-input" placeholder="Search prompts...">
      </div>
    </div>

    <main id="main-content">
      <div id="pinned-section">
        <h2 class="section-title">Pinned</h2>
        <div id="pinned-list"></div>
      </div>
      <div id="all-section">
        <h2 class="section-title">Popular Prompts</h2>
        <div id="prompt-list"></div>
      </div>
    </main>

    <button id="btn-add-prompt-float" class="btn-floating-add">
      <i data-lucide="plus-circle" width="20"></i> Thêm prompt
    </button>

    <nav class="bottom-nav">
      <div id="nav-home" class="nav-item active">
        <i data-lucide="home" width="22"></i>
        <span style="font-size: 10px; font-weight: 600;">Home</span>
      </div>
      <div id="nav-website" class="nav-item">
        <i data-lucide="external-link" width="22"></i>
        <span style="font-size: 10px; font-weight: 600;">Website</span>
      </div>
      <div id="nav-settings" class="nav-item">
        <i data-lucide="settings" width="22"></i>
        <span style="font-size: 10px; font-weight: 600;">Settings</span>
      </div>
    </nav>
  </div>

  <!-- Detail View Overlay -->
  <div id="detail-overlay" class="detail-overlay hidden">
    <div class="detail-header">
      <button id="btn-back" class="btn-icon">
        <i data-lucide="arrow-left" width="20"></i>
      </button>
      <h3 id="detail-title" style="margin: 0; flex: 1; font-size: 16px; font-weight: 700;">Prompt Title</h3>
      <button id="btn-edit-prompt" class="btn-icon" title="Edit Prompt">
        <i data-lucide="edit-3" width="18"></i>
      </button>
    </div>
    <div id="detail-content" class="detail-content"></div>
    <button id="btn-copy" class="btn-copy">
      <i data-lucide="copy" width="20"></i>
      Copy Prompt
    </button>
  </div>

  <!-- Settings Screen -->
  <div id="settings-screen" class="hidden" style="height: 100vh; display: flex; flex-direction: column;">
    <header>
      <div class="header-brand">
        <span class="logo-name">Settings</span>
      </div>
    </header>
    <div style="padding: 24px; flex: 1;">
      <div style="margin-bottom: 24px;">
        <label for="input-trigger-char"
          style="display: block; font-size: 13px; font-weight: 600; color: var(--slate-700); margin-bottom: 8px;">
          Trigger Character
        </label>
        <input type="text" id="input-trigger-char" class="search-input" style="padding-left: 12px;" placeholder="e.g. ?"
          maxlength="1">
        <p style="font-size: 12px; color: var(--slate-400); margin-top: 8px; line-height: 1.4;">
          Character used to trigger prompt search in chat boxes.
        </p>
      </div>
      <button id="btn-settings-save" class="btn-copy" style="margin: 0; width: 100%;">Save Settings</button>
    </div>
    <nav class="bottom-nav">
      <div id="nav-home-settings" class="nav-item">
        <i data-lucide="home" width="22"></i>
        <span style="font-size: 10px; font-weight: 600;">Home</span>
      </div>
      <div id="nav-website-settings" class="nav-item">
        <i data-lucide="external-link" width="22"></i>
        <span style="font-size: 10px; font-weight: 600;">Website</span>
      </div>
      <div id="nav-settings-settings" class="nav-item active">
        <i data-lucide="settings" width="22"></i>
        <span style="font-size: 10px; font-weight: 600;">Settings</span>
      </div>
    </nav>
  </div>

  <!-- Modal for Add/Edit -->
  <div id="modal-container" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Add New</h3>
        <button id="btn-modal-close" class="btn-icon"><i data-lucide="x" width="20"></i></button>
      </div>
      <div class="modal-body">
        <div id="topic-form" class="hidden">
          <input type="text" id="input-topic-name" class="search-input" style="padding-left: 12px;"
            placeholder="Topic Name">
        </div>
        <div id="prompt-form" class="hidden">
          <input type="text" id="input-prompt-title" class="search-input"
            style="padding-left: 12px; margin-bottom: 12px;" placeholder="Prompt Title">
          <textarea id="input-prompt-content" class="search-input"
            style="padding-left: 12px; height: 160px; resize: none;" placeholder="Prompt Content"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-modal-save" class="btn-copy" style="margin: 0; width: 100%;">Save</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>

</html>
