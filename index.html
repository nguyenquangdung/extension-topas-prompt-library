<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topas Library</title>
  <link rel="stylesheet" href="index.css">
  <script src="lib/supabase-lib.js"></script>
  <script src="lib/lucide.min.js"></script>
</head>

<body>
  <!-- Login Screen -->
  <div id="login-screen">
    <div style="margin-bottom: 24px;">
      <h1 class="logo" style="font-size: 24px; margin-bottom: 8px;">Topas</h1>
      <p style="color: var(--slate-500); font-size: 14px;">Prompt Library</p>
    </div>
    <button id="btn-login-google" class="btn-google">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" height="20" alt="G">
      Login with Google
    </button>
  </div>

  <!-- App Screen -->
  <div id="app-screen" class="hidden">
    <header>
      <span class="logo">Topas</span>
      <div id="user-info" style="display: flex; align-items: center; gap: 8px;">
        <a href="https://topas-prompt-library.pages.dev/#" target="_blank" id="btn-admin" class="btn-icon"
          title="Go to Admin">
          <i data-lucide="external-link" width="16"></i>
        </a>
        <span id="user-initial"
          style="width: 24px; height: 24px; background: var(--brand-50); color: var(--brand-700); display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; font-size: 11px;">T</span>
        <button id="btn-logout" style="background: none; border: none; color: var(--slate-400); cursor: pointer;"><i
            data-lucide="log-out" width="16"></i></button>
      </div>
    </header>

    <div id="market-tabs" class="nav-scroll"></div>
    <div class="topic-nav-container" style="background: var(--slate-50); border-bottom: 1px solid var(--slate-100);">
      <div id="topic-tabs" class="nav-scroll" style="border-bottom: none;"></div>
      <button id="btn-add-topic" class="btn-row" title="Add Topic">
        <i data-lucide="plus" width="14"></i> Thêm chủ đề
      </button>
    </div>

    <div class="search-container">
      <input type="text" id="input-search" class="search-input" placeholder="Search prompts...">
    </div>

    <main id="main-content">
      <div id="pinned-section">
        <h2 class="section-title">Pinned</h2>
        <div id="pinned-list"></div>
      </div>
      <div id="all-section">
        <h2 class="section-title">All Prompts</h2>
        <div id="prompt-list"></div>
        <button id="btn-add-prompt" class="btn-row" style="margin-top: 8px;" title="Add Prompt">
          <i data-lucide="plus" width="14"></i> Thêm prompt
        </button>
      </div>
    </main>
  </div>

  <!-- Detail View Overlay -->
  <div id="detail-overlay" class="detail-overlay hidden">
    <div class="detail-header">
      <button id="btn-back" style="background: none; border: none; cursor: pointer; color: var(--slate-600);"><i
          data-lucide="arrow-left" width="20"></i></button>
      <h3 id="detail-title" class="prompt-title" style="margin: 0; flex: 1;">Prompt Title</h3>
      <button id="btn-edit-prompt" class="btn-icon" title="Edit Prompt">
        <i data-lucide="edit-3" width="18"></i>
      </button>
    </div>
    <div id="detail-content" class="detail-content"></div>
    <button id="btn-copy" class="btn-copy">
      <i data-lucide="copy" width="18"></i>
      Copy Prompt
    </button>
  </div>

  <!-- Modal for Add/Edit -->
  <div id="modal-container" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Add New</h3>
        <button id="btn-modal-close" class="btn-icon"><i data-lucide="x" width="18"></i></button>
      </div>
      <div class="modal-body">
        <div id="topic-form" class="hidden">
          <input type="text" id="input-topic-name" class="search-input" placeholder="Topic Name">
        </div>
        <div id="prompt-form" class="hidden">
          <input type="text" id="input-prompt-title" class="search-input" placeholder="Prompt Title"
            style="margin-bottom: 12px;">
          <textarea id="input-prompt-content" class="search-input" placeholder="Prompt Content"
            style="height: 120px; resize: none;"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-modal-save" class="btn-copy" style="margin: 0; width: 100%;">Save</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>

</html>
